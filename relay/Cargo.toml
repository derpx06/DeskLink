[package]
name = "desklink-relay"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WebSocket relay that forwards end-to-end encrypted DeskLink signaling between mutually paired devices"
publish = false

# Standalone: the desktop app's manifest one directory up is not a workspace,
# and this crate must build without GTK/GStreamer on a $6 droplet.
[workspace]

[lib]
name = "desklink_relay"
path = "src/lib.rs"

[[bin]]
name = "desklink-relay"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tungstenite = "0.30"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
