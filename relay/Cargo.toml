[package]
name = "desklink-relay"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WebSocket relay that forwards end-to-end encrypted DeskLink signaling between mutually paired devices"
publish = false

# Standalone: the desktop app's manifest one directory up is not a workspace,
# and this crate must build without GTK/GStreamer on a $6 droplet.
[workspace]

[lib]
name = "desklink_relay"
path = "src/lib.rs"

[[bin]]
name = "desklink-relay"
path = "src/main.rs"
required-features = ["server"]

# The desktop app depends on this crate for `protocol` only, with
# `default-features = false`, so it builds none of the server.
[features]
default = ["server"]
server = ["dep:base64", "dep:openssl", "dep:toml", "dep:tungstenite", "dep:ureq"]

[dependencies]
base64 = { version = "0.22", optional = true }
openssl = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", optional = true }
tungstenite = { version = "0.30", optional = true }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
