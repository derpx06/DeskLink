# Run from this directory:  docker compose up -d
# With self-hosted TURN:    docker compose --profile coturn up -d
#
# Everything uses host networking. Caddy then sees real client IPv4 and IPv6
# addresses (Docker's IPv6-to-IPv4 port proxy would replace every IPv6 client
# with the bridge gateway), and the relay sees Caddy as 127.0.0.1, which is
# the default trusted proxy.

services:
  caddy:
    image: caddy:2.9.1
    restart: unless-stopped
    network_mode: host
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: desklink-relay:latest
    restart: unless-stopped
    network_mode: host
    environment:
      DESKLINK_RELAY_CF_TOKEN: ${DESKLINK_RELAY_CF_TOKEN:-}
      DESKLINK_RELAY_TURN_SECRET: ${DESKLINK_RELAY_TURN_SECRET:-}
    volumes:
      - ./config.toml:/etc/desklink-relay/config.toml:ro
      - relay_state:/var/lib/desklink-relay

  coturn:
    profiles: ["coturn"]
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    # The secret is read from the environment by the container's own start line (a shell expansion at run time),
    # not passed in the compose `command`: it is not in `docker inspect`'s Args and not in this file. It is
    # still in the container's environment (`docker inspect` Env, /proc/<pid>/environ, root on the host only).
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec turnserver -c /etc/coturn/turnserver.conf "--static-auth-secret=$$DESKLINK_RELAY_TURN_SECRET"'
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn-certs:/etc/coturn/certs:ro

volumes:
  caddy_data:
  caddy_config:
  relay_state:
