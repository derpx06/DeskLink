# coturn for DeskLink (compose profile "coturn"). Credentials are minted by the
# relay with the same secret (TURN REST API, use-auth-secret); there are no
# static users.

# The secret is NOT in this tracked file: docker-compose.yml passes
# --static-auth-secret from DESKLINK_RELAY_TURN_SECRET in the untracked .env,
# the same value the relay signs credentials with.
use-auth-secret
realm=relay.example.com

listening-port=3478
tls-listening-port=5349
# Copied from Caddy's storage by the renewal step in DEPLOY.md.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Relay port range; must match the firewall rule (49160-49260/udp).
min-port=49160
max-port=49260

# Per-session bandwidth (bytes/s, ~8 Mbit/s), concurrent allocations in
# total and per credential, and a one-hour cap per allocation so a leaked
# credential cannot hold a relay.
max-bps=1000000
total-quota=100
user-quota=4
max-allocate-lifetime=3600
# Total relay bandwidth in bytes/s across all sessions. SET THIS for your
# droplet: e.g. 3000000 (~24 Mbit/s) keeps a $6 droplet's 1 TB/month from
# being spent in a few days by one heavy pair. 0 means unlimited.
bps-capacity=3000000

fingerprint
no-multicast-peers
no-rfc5780
no-software-attribute
no-tcp-relay
no-cli

# Never relay into private, loopback, link-local, CGNAT, documentation,
# benchmark, reserved or translation ranges: without these a TURN credential
# is a pivot into the droplet's own network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::-::
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# The droplet's own public addresses (DEPLOY.md step 8): uncomment and fill in,
# or a TURN client can reach services listening on the droplet itself.
#denied-peer-ip=203.0.113.10
#denied-peer-ip=2001:db8::10

# coturn logs client addresses. Keep logs short-lived on the host, or add
# no-stdout-log to disable them.
simple-log
