[package]
name = "desklink"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3.6.1"
base64 = "0.22"
dirs = "6"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
hostname = "0.4"
libc = "0.2"
mdns-sd = { version = "0.21", default-features = false }
openssl = "0.10"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"

[dependencies.gst]
package = "gstreamer"
version = "0.23.6"
features = ["v1_28"]

[dependencies.gst-webrtc]
package = "gstreamer-webrtc"
version = "0.23.5"
features = ["v1_26"]

[dependencies.gst-sdp]
package = "gstreamer-sdp"
version = "0.23.5"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]
