[package]
name = "desklink"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3.6.1"
ashpd = "0.12.3"
base64 = "0.22"
dirs = "6"
enumflags2 = "0.7"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
hostname = "0.4"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.43", features = ["rt", "sync", "net", "time", "io-util"] }

[dependencies.gst]
package = "gstreamer"
version = "0.23.6"
features = ["v1_28"]

[dependencies.gst-webrtc]
package = "gstreamer-webrtc"
version = "0.23.5"
features = ["v1_26"]

[dependencies.gst-sdp]
package = "gstreamer-sdp"
version = "0.23.5"

[dependencies.gst-app]
package = "gstreamer-app"
version = "0.23.5"

[dependencies.gst-video]
package = "gstreamer-video"
version = "0.23.5"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]
