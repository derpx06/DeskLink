[package]
name = "desklink"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3.6.1"
dirs = "6"
enigo = { version = "0.6.1", features = ["libei_smol", "wayland"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
hostname = "0.4"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]
