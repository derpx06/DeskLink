name: Bug report
description: Something in DeskLink does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: please do not file them here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pair the phone
        2. Open …
        3. …
    validations:
      required: true
  - type: input
    id: desklink-version
    attributes:
      label: DeskLink desktop version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Flathub
        - AUR (desklink)
        - AUR (desklink-bin)
        - GitHub Releases tarball
        - Built from source
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution, GNOME version, Wayland or X11
      placeholder: "Arch Linux, GNOME 51, Wayland"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model, Android version, DeskLink Android app version
  - type: dropdown
    id: network
    attributes:
      label: Connection
      options:
        - Same network (LAN)
        - Away from home (relay)
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run `desklink` from a terminal and paste the output around the problem. Remove anything private.
      render: text
