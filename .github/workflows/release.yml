name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# The relay the app uses away from home unless the user sets their own
# (relay/deploy/DEPLOY.md). Set it under Settings > Secrets and variables >
# Actions > Variables; a release without it would ship a placeholder address.
env:
  DESKLINK_RELAY_URL: ${{ vars.DESKLINK_RELAY_URL }}

jobs:
  # Nothing is built or published unless the checks pass on this tag.
  ci:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rust meson gtk4 libadwaita openssl libnice \
            gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad \
            gst-plugin-pipewire gst-plugin-gtk4 gst-libav \
            desktop-file-utils appstream

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag and the relay address
        run: |
          grep -q "version: '${GITHUB_REF_NAME#v}'" meson.build
          # The relay address is only needed once the relay is compiled in
          # (RELAY_ENABLED); in a LAN-only release it is inert.
          if [ -z "$DESKLINK_RELAY_URL" ]; then
            flag=$(grep -E 'const RELAY_ENABLED: bool = (true|false)' src/device_links/relay_link/mod.rs || true)
            [ -n "$flag" ] || { echo "::error::cannot read RELAY_ENABLED in src/device_links/relay_link/mod.rs"; exit 1; }
            if echo "$flag" | grep -q '= true'; then
              echo "::error::DESKLINK_RELAY_URL is not set but the relay is enabled in this build"
              exit 1
            fi
            echo "::warning::DESKLINK_RELAY_URL is not set: this release is LAN-only (RELAY_ENABLED is false)"
          fi

      - name: Build the app tarball
        run: |
          version=${GITHUB_REF_NAME#v}
          stage="$PWD/stage/desklink-$version-x86_64"
          meson setup build --prefix=/usr
          meson compile -C build
          meson test -C build --print-errorlogs
          meson install -C build --destdir "$stage"
          install -Dm644 COPYING "$stage/usr/share/licenses/desklink/COPYING"
          test -f "$stage/usr/share/licenses/desklink/THIRD_PARTY_LICENSES"
          tar -C stage -czf "desklink-$version-x86_64.tar.gz" "desklink-$version-x86_64"

      - name: Build the relay binary
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo build --release --locked --manifest-path relay/Cargo.toml
          install -m755 relay/target/release/desklink-relay "desklink-relay-$version-x86_64"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: |
            desklink-*-x86_64.tar.gz
            desklink-relay-*-x86_64

  flatpak:
    needs: ci
    runs-on: ubuntu-latest
    container:
      # Must carry the manifest's runtime (GNOME 51).
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The manifest is releasable (tag, commit, permissions)
        # The tag's own commit cannot be written in the manifest it tags: it is
        # this run's (the Flathub PR carries the committed one).
        run: python3 flatpak/check-manifest.py --release --commit "$GITHUB_SHA" || { echo "::error::the Flatpak manifest is not releasable (flatpak/check-manifest.py --release)"; exit 1; }

      - name: Generate cargo sources and a manifest for this checkout
        run: |
          dnf install -y git python3-aiohttp python3-tomlkit
          # Pinned: this script runs with the release's credentials.
          git clone https://github.com/flatpak/flatpak-builder-tools /tmp/fbt
          git -C /tmp/fbt checkout 9d86d336a39b9af38b86f114b6ce5820fe260f91
          python3 /tmp/fbt/cargo/flatpak-cargo-generator.py Cargo.lock -o flatpak/cargo-sources.json
          python3 flatpak/ci-manifest.py

      - name: Build the bundle
        run: |
          version=${GITHUB_REF_NAME#v}
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --repo=repo --force-clean build-flatpak ci-manifest.json
          flatpak build-bundle repo "desklink-$version-x86_64.flatpak" derx06.desklink.com

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak
          path: desklink-*-x86_64.flatpak

  publish:
    needs: [binaries, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum desklink-* > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # 0.x is a beta: a PRERELEASE, so it is never "latest".
          prerelease: true
          name: ${{ github.ref_name }} (beta)
          body: |
            **Beta.** DeskLink ${{ github.ref_name }} is the first public release: it works and is still being
            shaped. Install: the Flatpak bundle (`flatpak install --user ./desklink-*.flatpak`) or the tarball;
            see the README. Please report problems on the issue tracker.
          generate_release_notes: true
          files: |
            desklink-*
            SHA256SUMS
